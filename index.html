<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root {
    --fs: 19px;
    --serif: "STIX Two Text", "STIX Two", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --bar-h: 3.25rem;
    --toc-w: 20rem;
  }
  :root[data-theme="sepia"] { --paper:#faf6ef; --ink:#2b2620; --surface:#f3ecdc; --rule:#d9cdb0; --muted:#6a5d48; --accent:#2c5f7c; --on-accent:#ffffff; color-scheme: light; }
  :root[data-theme="light"] { --paper:#ffffff; --ink:#1b1d20; --surface:#f4f5f6; --rule:#e1e4e8; --muted:#5c6570; --accent:#2c5f7c; --on-accent:#ffffff; color-scheme: light; }
  :root[data-theme="dark"]  { --paper:#17191c; --ink:#e6e3dc; --surface:#20242a; --rule:#343a42; --muted:#98a0aa; --accent:#8fc1dc; --on-accent:#10202a; color-scheme: dark; }

  * { box-sizing: border-box; }
  html { font-size: var(--fs); scroll-padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + .5rem); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); line-height: 1.7; -webkit-tap-highlight-color: transparent; }
  a { color: var(--accent); text-underline-offset: .18em; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* top bar */
  .bar { position: fixed; inset: 0 0 auto 0; z-index: 30; height: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) .6rem 0; display: flex; align-items: center; gap: .4rem; background: var(--paper); border-bottom: 1px solid var(--rule); }
  .bar .title { flex: 1; min-width: 0; text-align: center; font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); text-decoration: none; }
  .tool { height: 2.2rem; min-width: 2.2rem; padding: 0 .55rem; border-radius: 6px; font-size: .85rem; display: inline-flex; align-items: center; justify-content: center; gap: .35rem; }
  .tool:hover { background: var(--surface); }
  .swatches { display: inline-flex; gap: .3rem; padding: 0 .2rem; }
  .swatch { width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 1px solid var(--rule); padding: 0; }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--accent); }
  .swatch.sepia { background: #f3ecdc; } .swatch.light { background: #ffffff; } .swatch.dark { background: #17191c; }
  .cycle { display: none; background: linear-gradient(90deg, var(--ink) 50%, var(--paper) 50%); }
  @media (max-width: 560px) {
    .swatches { display: none; } .cycle { display: inline-block; margin: 0 .25rem; }
    .tool { padding: 0 .4rem; min-width: 2rem; } .bar { gap: .15rem; }
  }

  /* contents */
  .toc { position: fixed; z-index: 25; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); bottom: 0; left: 0; width: min(var(--toc-w), 86vw); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--rule); padding: 1rem .6rem calc(1.5rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-102%); transition: transform .2s ease; }
  body.toc-open .toc { transform: none; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc a, .toc .off { display: grid; grid-template-columns: 3.2rem 1fr; gap: .2rem; padding: .42rem .55rem; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: .9rem; line-height: 1.35; }
  .toc .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .toc .off { color: var(--muted); opacity: .62; cursor: default; }
  .toc a:hover { background: var(--paper); }
  .toc a[aria-current="page"] { background: var(--paper); color: var(--accent); font-weight: 600; }
  .toc details { border-top: 1px solid var(--rule); }
  .toc details:last-of-type { border-bottom: 1px solid var(--rule); }
  .toc .top { margin-bottom: .6rem; }
  .toc summary { list-style: none; display: grid; grid-template-columns: 3.3rem 1fr; gap: .2rem; padding: .55rem .55rem; border-radius: 6px; cursor: pointer; font-size: .9rem; line-height: 1.35; font-weight: 600; }
  .toc summary::-webkit-details-marker { display: none; }
  .toc summary:hover { background: var(--paper); }
  .toc summary .pid { color: var(--muted); font-weight: 500; white-space: nowrap; }
  .toc summary .pid::before { content: "▸"; display: inline-block; width: .9em; font-size: .75em; transition: transform .15s ease; }
  .toc details[open] > summary .pid::before { transform: rotate(90deg); }
  .toc details > ol { padding-bottom: .5rem; }
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  body.toc-open .scrim { opacity: 1; pointer-events: auto; }

  main { padding: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 1.6rem) 1.15rem calc(4rem + env(safe-area-inset-bottom, 0px)); transition: margin-left .2s ease; }
  .col { max-width: 40rem; margin: 0 auto; }

  @media (min-width: 1100px) {
    .scrim { display: none; }
    body.toc-open main { margin-left: var(--toc-w); }
  }

  /* session text */
  .prose h1 { font-size: 2.05rem; line-height: 1.18; font-weight: 600; margin: .2em 0 1.1em; letter-spacing: -.005em; }
  .prose h2 { font-size: 1.36rem; line-height: 1.3; font-weight: 600; margin: 2.3em 0 .6em; }
  .prose h3 { font-size: 1.1rem; font-weight: 600; margin: 1.8em 0 .4em; }
  .prose p { margin: 0 0 1.05em; }
  .prose ul, .prose ol { padding-left: 1.4em; margin: 0 0 1.1em; }
  .prose li { margin: .3em 0; }
  .prose strong { font-weight: 600; }
  .prose blockquote { margin: 1.4em 0; padding: .8rem 1rem; background: var(--surface); border-left: 3px solid var(--rule); border-radius: 0 8px 8px 0; }
  .prose blockquote > :last-child { margin-bottom: 0; }
  .prose code { font-family: var(--mono); font-size: .8em; background: var(--surface); padding: .1em .32em; border-radius: 4px; }
  .prose pre { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: .9rem 1rem; overflow-x: auto; line-height: 1.5; margin: 0 0 1.3em; }
  .prose pre code { background: none; padding: 0; font-size: .74rem; }
  /* position: relative keeps KaTeX's absolutely positioned MathML inside the scroll box */
  .table-wrap { overflow-x: auto; margin: 0 0 1.4em; position: relative; }
  .prose table { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.45; }
  .prose th { text-align: left; font-weight: 600; border-bottom: 1.5px solid var(--ink); padding: .4rem .7rem .4rem 0; }
  .prose td { border-bottom: 1px solid var(--rule); padding: .45rem .7rem .45rem 0; vertical-align: top; }
  .prose p.fig { margin: 1.8em 0 .5em; text-align: center; }
  .prose p.fig img { max-width: 100%; height: auto; background: #fff; padding: .6rem; border-radius: 8px; border: 1px solid var(--rule); }
  .prose p.caption { font-size: .86rem; color: var(--muted); line-height: 1.5; margin: 0 auto 2em; max-width: 34rem; }
  .prose p.caption em { font-style: normal; }
  .math-block { overflow-x: auto; overflow-y: hidden; margin: 1.15em 0; padding: .15em 0; position: relative; }
  .math-block .katex-display { margin: 0; }
  .katex { font-size: 1.04em; }
  .math-error { font-family: var(--mono); font-size: .8em; color: #b4532a; }

  .crumb { margin: 0 0 .9rem; font-size: .88rem; color: var(--muted); }
  .crumb a { color: var(--muted); }
  .crumb a:hover { color: var(--accent); }
  .after { margin: 2.4rem 0 0; }
  .after a { display: inline-block; border: 1px solid var(--rule); border-radius: 8px; padding: .55rem .9rem; text-decoration: none; }
  .after a:hover { border-color: var(--accent); }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-top: 3.2rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }
  .pager a { display: block; padding: .7rem .9rem; border: 1px solid var(--rule); border-radius: 8px; text-decoration: none; color: var(--ink); line-height: 1.35; }
  .pager a:hover { border-color: var(--accent); }
  .pager small { display: block; color: var(--muted); font-size: .8rem; }
  .pager .next { text-align: right; grid-column: 2; }

  /* cover */
  .cover h1 { font-size: clamp(2.3rem, 7.5vw, 3.5rem); line-height: 1.06; font-weight: 600; margin: .4rem 0 .5rem; letter-spacing: -.012em; }
  .cover .sub { font-size: 1.15rem; color: var(--muted); margin: 0 0 1.6rem; font-style: italic; }
  .cover .lead { margin: 0 0 1.2rem; }
  .questions { list-style: none; padding: 0; margin: 0 0 1.9rem; border-left: 2px solid var(--rule); }
  .questions li { display: grid; grid-template-columns: 2.4rem 1fr; padding: .15rem 0 .15rem .9rem; }
  .questions .q { color: var(--muted); font-variant-numeric: tabular-nums; }
  .start { display: inline-block; background: var(--accent); color: var(--on-accent); text-decoration: none; padding: .6rem 1.15rem; border-radius: 8px; font-weight: 600; margin: 0 .9rem .5rem 0; }
  .resume { display: inline-block; padding: .6rem 0; margin-right: .9rem; }
  .actions { margin: 0 0 .2rem; }
  .actions .syl { display: block; font-size: .92rem; }
  .contents { list-style: none; padding: 0; margin: 2.4rem 0 0; border-top: 1px solid var(--rule); }
  .contents li { border-bottom: 1px solid var(--rule); }
  .contents a, .contents .row { display: grid; grid-template-columns: 3.6rem 1fr; padding: .75rem 0; text-decoration: none; color: var(--ink); }
  .contents .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .contents b { font-weight: 600; display: block; line-height: 1.35; }
  .contents .meta { display: block; color: var(--muted); font-size: .8rem; line-height: 1.45; margin: .15rem 0 .2rem; font-variant-numeric: tabular-nums; }
  .contents .text { display: block; color: var(--muted); font-size: .9rem; line-height: 1.45; }
  .contents a:hover b { color: var(--accent); }
  .contents .off b { color: var(--muted); font-weight: 500; }
  .contents.sessions { margin-top: 1rem; }
  .contents.sessions .text { color: var(--ink); opacity: .82; }
  .part-goal { font-size: 1.05rem; margin: 0 0 .6rem; }
  .part-meta { color: var(--muted); font-size: .88rem; margin: 0 0 1rem; }
  .section-h { font-size: 1.36rem; line-height: 1.3; font-weight: 600; margin: 2.3em 0 .4em; }
  .section-note { color: var(--muted); font-size: .9rem; margin: 0; }
  .notice { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 1rem 1.1rem; }

  /* offline download, at the foot of the contents drawer */
  .offline { margin: 1.2rem .55rem 0; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: .82rem; line-height: 1.45; }
  .offline h2 { margin: 0 0 .45rem; font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .offline p { margin: 0 0 .55rem; }
  .offline .hint { color: var(--muted); }
  .offline .save { background: var(--accent); color: var(--on-accent); padding: .45rem .8rem; border-radius: 6px; font-size: .82rem; font-weight: 600; }
  .offline .again { padding: 0; color: var(--muted); font-size: .78rem; text-decoration: underline; text-underline-offset: .18em; }
  .offline .meter { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .offline .meter div { height: 100%; background: var(--accent); transition: width .2s; }

  @media (prefers-reduced-motion: reduce) { .toc, .scrim, main, .toc summary .pid::before { transition: none; } }
  @media print { .bar, .toc, .scrim, .pager, .after, .crumb { display: none !important; } main { padding: 0; margin: 0 !important; } }
</style>

<script>

function renderTex(src, display) {

    return katex.renderToString(src, { displayMode: display, throwOnError: true, strict: "ignore" });
  } catch (err) {

  }
}
var mathBlock = {
  name: "mathBlock", level: "block",
  start: function (src) { var i = src.indexOf("$$"); return i < 0 ? undefined : i; },
  tokenizer: function (src) {
    var m = /^\$\$[ \t]*\n?([\s\S]+?)\n?[ \t]*\$\$[ \t]*(?:\n|$)/.exec(src);

  },
  renderer: function (tok) { return '<div class="math-block">' + renderTex(tok.text, true) + "</div>\n"; }
};
var mathInline = {
  name: "mathInline", level: "inline",
  start: function (src) { var i = src.indexOf("$"); return i < 0 ? undefined : i; },
  tokenizer: function (src) {

  renderer: function (tok) { return renderTex(tok.text, false); }
};
var markedReady = false;

(function () {
  var view = document.getElementById("view");
  var tocList = document.getElementById("tocList");

  var wide = window.matchMedia("(min-width: 1100px)");

  function save(k, v) { try { localStorage.setItem("qm-book:" + k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem("qm-book:" + k); } catch (e) { return null; } }

  /* ---------- settings ---------- */
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    var sw = document.querySelectorAll(".swatch");
    for (var i = 0; i < sw.length; i++) if (sw[i].dataset.theme) sw[i].setAttribute("aria-pressed", String(sw[i].dataset.theme === t));

    save("theme", t);
  }
  function setSize(px) {
    px = Math.max(15, Math.min(25, px));
    document.documentElement.style.setProperty("--fs", px + "px");
    save("size", String(px));
  }
  function currentSize() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 19; }
  var storedTheme = load("theme");
  setTheme(storedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "sepia"));
  if (load("size")) setSize(parseFloat(load("size")));
  document.getElementById("smaller").onclick = function () { setSize(currentSize() - 1); };
  document.getElementById("larger").onclick = function () { setSize(currentSize() + 1); };
  var swatches = document.querySelectorAll(".swatch");
  for (var i = 0; i < swatches.length; i++) if (swatches[i].dataset.theme) swatches[i].onclick = function () { setTheme(this.dataset.theme); };
  document.getElementById("cycle").onclick = function () {
    var order = ["sepia", "light", "dark"], now = document.documentElement.getAttribute("data-theme");
    setTheme(order[(order.indexOf(now) + 1) % order.length]);
  };

  /* ---------- contents drawer ---------- */
  var tocBtn = document.getElementById("tocBtn");
  function setToc(open) {
    document.body.classList.toggle("toc-open", open);
    tocBtn.setAttribute("aria-expanded", String(open));
    if (wide.matches) save("toc", open ? "1" : "0");
  }
  tocBtn.onclick = function () { setToc(!document.body.classList.contains("toc-open")); };
  document.getElementById("scrim").onclick = function () { setToc(false); };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !wide.matches) setToc(false);
    if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {

      if (link) location.hash = link.getAttribute("href");

  setToc(wide.matches && load("toc") !== "0");

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function session(n) { return book.sessions[n - 1] || null; }
  function partOf(id) { return book.parts[partIndex[id]] || null; }
  function num(s) { return s.part + "." + s.n; }
  function label(s) { return num(s) + ". " + s.title; }
  function longLabel(s) { return label(s); }
  function partLabel(p) { return "Part " + p.id + ". " + p.title; }
  function range(p) { return p.first === p.last ? "Session " + p.first : "Sessions " + p.first + "–" + p.last; }
  function kindName(k) { return k.charAt(0).toUpperCase() + k.slice(1); }
  function sessionHref(s) { return "#/s/" + s.slug; }
  // The nearest written session before or after n, or null.

  function partSessions(p) { return book.sessions.slice(p.first - 1, p.last); }
  function writtenIn(p) { return partSessions(p).filter(function (s) { return s.file; }).length; }

  function buildToc() {
    var html = '<ol class="top"><li><a href="#/syllabus" data-key="syllabus"><span class="n">0.</span><span>Syllabus</span></a></li></ol>';
    html += book.parts.map(function (p) {
      return '<details data-part="' + esc(p.id) + '"><summary><span class="pid">' + esc(p.id) + '</span><span>' + esc(p.title) + "</span></summary><ol>" +
        '<li><a href="#/part/' + esc(p.id) + '" data-key="part:' + esc(p.id) + '"><span class="n"></span><span>About this Part</span></a></li>' +
        partSessions(p).map(function (s) {

          return s.file ? '<li><a href="' + sessionHref(s) + '" data-key="s:' + esc(s.slug) + '">' + inner + "</a></li>"
                        : '<li><span class="off" title="Not yet written">' + inner + "</span></li>";
        }).join("") + "</ol></details>";
    }).join("");
    tocList.innerHTML = html;
    tocList.addEventListener("click", function (e) { if (e.target.closest("a") && !wide.matches) setToc(false); });
  }
  // key is "syllabus", "part:<id>", "s:<slug>" or ""; partId opens that Part's group.
  function markCurrent(key, partId) {
    if (partId) {
      var d = tocList.querySelector('details[data-part="' + partId + '"]');
      if (d) d.open = true;

    for (var i = 0; i < links.length; i++) {

    if (cur) cur.scrollIntoView({ block: "nearest" });
  }

  /* ---------- loading a Markdown file ---------- */
  var NO_LIBS = '<p class="notice">The page could not load its formatting libraries, so this page is shown as plain text. Check the network connection and reload.</p>';
  function md(text) { return window.marked && window.katex ? renderMarkdown(text) : NO_LIBS + "<pre>" + esc(text) + "</pre>"; }
  function fetchFile(file, what, done) {
    var my = ++seq;
    if (cache[file] != null) { done(cache[file]); return; }
    view.innerHTML = '<p style="color:var(--muted)">Loading ' + esc(what) + "…</p>";
    fetch(file).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (t) { cache[file] = t; if (my === seq) done(t); })
      .catch(function () {
        if (my !== seq) return;
        if (!navigator.onLine) {
          view.innerHTML = '<div class="notice"><p><strong>You are offline, and this page has not been saved.</strong></p><p>When you are back online, open Contents and choose “Save for offline” to keep the book on this device.</p></div>';
          return;
        }
        view.innerHTML = '<div class="notice"><p><strong>This page could not be loaded.</strong></p><p>The file <code>' + esc(file) + "</code> was not found or could not be read. If you opened <code>index.html</code> directly from disk, serve the folder instead: run <code>python -m http.server</code> in it and open <code>http://localhost:8000</code>.</p></div>";
      });
  }
  function pagerLink(cls, href, text) {
    return '<a class="' + cls + '" href="' + href + '"><small>' + (cls === "prev" ? "Previous" : "Next") + "</small>" + esc(text) + "</a>";
  }
  function pager(prev, next) { return '<nav class="pager" aria-label="Pages">' + (prev || "") + (next || "") + "</nav>"; }
  function prevOf(n) {
    var p = prevWritten(n);
    return p ? pagerLink("prev", sessionHref(p), label(p)) : pagerLink("prev", "#/syllabus", "0. Syllabus");
  }
  function nextOf(n) { var s = nextWritten(n); return s ? pagerLink("next", sessionHref(s), label(s)) : ""; }

  /* ---------- after rendering ---------- */
  function finish(file, current) {
    var dir = file.slice(0, file.lastIndexOf("/") + 1);
    var imgs = view.querySelectorAll(".prose img");
    for (var i = 0; i < imgs.length; i++) {
      var src = imgs[i].getAttribute("src");
      if (!/^(https?:|data:|\/)/.test(src)) imgs[i].setAttribute("src", dir + src);
      imgs[i].setAttribute("loading", "lazy");
      var p = imgs[i].parentElement;
      if (p && p.tagName === "P" && p.children.length === 1) {
        p.classList.add("fig");
        var cap = p.nextElementSibling;
        if (cap && cap.tagName === "P" && cap.children.length >= 1 && cap.firstElementChild.tagName === "EM" && cap.firstChild === cap.firstElementChild) cap.classList.add("caption");
      }
    }
    var tables = view.querySelectorAll(".prose table");
    for (var j = 0; j < tables.length; j++) {
      var wrap = document.createElement("div"); wrap.className = "table-wrap";
      tables[j].parentNode.insertBefore(wrap, tables[j]); wrap.appendChild(tables[j]);
    }
    rewriteLinks(dir);
    linkRefs(current || 0);
  }

  // Relative links to sessions/NNN-slug.md and solutions/NNN-slug.md become
  // in-app routes; other relative links are resolved against the file's folder.
  var FILE_LINK = /^(sessions|solutions)\/(\d{3})-([a-z0-9-]+)\.md$/;
  function rewriteLinks(dir) {
    var as = view.querySelectorAll(".prose a[href]");
    for (var i = 0; i < as.length; i++) {
      var href = as[i].getAttribute("href");
      if (/^(#|[a-z][a-z0-9+.-]*:|\/)/i.test(href)) continue;
      var u = new URL(dir + href, "http://book.invalid/"), path = decodeURIComponent(u.pathname.slice(1));
      var m = FILE_LINK.exec(path), s = m && (bySlug[m[3]] || session(parseInt(m[2], 10)));
      if (s) as[i].setAttribute("href", (m[1] === "sessions" ? "#/s/" : "#/sol/") + s.slug);
      else if (path === book.syllabus) as[i].setAttribute("href", "#/syllabus");
      else as[i].setAttribute("href", path + u.search + u.hash);
    }
  }

  // "Session 7", "Sessions 3 and 4", "Sessions 3, 4 and 5", "Sessions 3-5":
  // each number that names a written session becomes a link. Text inside
  // KaTeX output, code, existing links and the page heading is left alone.
  var REF = /\b(Sessions?)(\s+)(\d+(?:(?:\s*,\s*(?:(?:and|or)\s+)?|\s+(?:and|or|to)\s+|\s*[-–]\s*)\d+)*)(?!\d|\.\d)/g;
  var SKIP = "a, code, pre, h1, .katex, .math-error, script, style";
  function refTarget(n, current) {
    if (n === current) return null;
    if (n === 0) return { href: "#/syllabus", title: "Syllabus" };
    var s = session(n);
    if (!s || !s.file) return null;
    return { href: sessionHref(s), title: longLabel(s) };
  }
  function link(t, text) { var a = document.createElement("a"); a.href = t.href; a.title = t.title; a.textContent = text; return a; }
  function linkRefs(current) {
    var root = view.querySelector(".prose");
    if (!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes = [], node;
    while ((node = walker.nextNode())) {
      REF.lastIndex = 0;
      if (REF.test(node.nodeValue) && !(node.parentElement && node.parentElement.closest(SKIP))) nodes.push(node);
    }
    nodes.forEach(function (tn) {
      var text = tn.nodeValue, frag = document.createDocumentFragment(), last = 0, m, changed = false;
      REF.lastIndex = 0;
      while ((m = REF.exec(text))) {
        var nums = m[3].split(/(\d+)/), single = nums.length === 3;
        frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        if (single) {
          var t = refTarget(parseInt(nums[1], 10), current);
          if (t) { frag.appendChild(link(t, m[0])); changed = true; } else frag.appendChild(document.createTextNode(m[0]));
        } else {
          frag.appendChild(document.createTextNode(m[1] + m[2]));
          nums.forEach(function (piece, k) {
            var t = k % 2 ? refTarget(parseInt(piece, 10), current) : null;
            if (t) { frag.appendChild(link(t, piece)); changed = true; } else if (piece) frag.appendChild(document.createTextNode(piece));
          });
        }
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(text.slice(last)));
      if (changed) tn.parentNode.replaceChild(frag, tn);
    });
  }
  // In the syllabus tables, the "#" cell of a written session links to it.
  function linkSyllabusRows() {
    var rows = view.querySelectorAll(".prose tbody tr");
    for (var i = 0; i < rows.length; i++) {
      var td = rows[i].firstElementChild;
      var m = td && /^\d+\.(\d+)$/.exec(td.textContent.trim());
      if (!m) continue;
      var table = rows[i].closest("table"), th = table && table.querySelector("th");
      if (!th || th.textContent.trim() !== "#") continue;
      var s = session(parseInt(m[1], 10));
      if (s && s.file) { var n = td.textContent.trim(); td.textContent = ""; td.appendChild(link({ href: sessionHref(s), title: longLabel(s) }, n)); }
    }
  }

  /* ---------- pages ---------- */
  function setChrome(bar, title) { barTitle.textContent = bar; document.title = title ? title + " · " + book.title : book.title; }

  function showSyllabus() {
    markCurrent("syllabus", null);
    setChrome("0. Syllabus", "Syllabus");
    fetchFile(book.syllabus, "the syllabus", function (text) {
      var first = written[0], next = first ? pagerLink("next", sessionHref(first), label(first)) : pagerLink("next", "#/part/" + book.parts[0].id, partLabel(book.parts[0]));
      view.innerHTML = '<article class="prose">' + md(text) + "</article>" + pager("", next);
      finish(book.syllabus, 0);
      linkSyllabusRows();
      window.scrollTo(0, 0);
    });
  }

  function crumb(p) { return '<p class="crumb"><a href="#/part/' + esc(p.id) + '">' + esc(partLabel(p)) + "</a></p>"; }

  function showSession(s) {
    var p = partOf(s.part);
    markCurrent("s:" + s.slug, s.part);
    setChrome(label(s), longLabel(s));
    if (!s.file) {
      ++seq;
      var uses = s.uses.length ? " Builds on " + (s.uses.length > 1 ? "Sessions " + s.uses.slice(0, -1).join(", ") + " and " + s.uses[s.uses.length - 1] : "Session " + s.uses[0]) + "." : "";
      view.innerHTML = crumb(p) + '<article class="prose"><h1>' + esc(longLabel(s)) + "</h1><p><em>" + esc(kindName(s.kind)) + "." + esc(uses) + "</em></p>" +
        "<p><strong>Claim.</strong> " + esc(s.claim) + '</p><div class="notice"><p style="margin:0">This session has not been written yet.</p></div></article>' + pager(prevOf(s.n), nextOf(s.n));
      linkRefs(s.n);
      window.scrollTo(0, 0);
      return;
    }
    save("last", s.slug);
    fetchFile(s.file, label(s), function (text) {
      var after = s.solutions ? '<p class="after"><a href="#/sol/' + esc(s.slug) + '">Solutions to the exercises</a></p>' : "";
      view.innerHTML = crumb(p) + '<article class="prose">' + md(text) + "</article>" + after + pager(prevOf(s.n), nextOf(s.n));
      finish(s.file, s.n);
      window.scrollTo(0, 0);
    });
  }

  function showSolutions(s) {
    markCurrent("s:" + s.slug, s.part);
    setChrome(num(s) + ". Solutions", "Solutions to " + label(s));
    var back = '<p class="crumb"><a href="' + sessionHref(s) + '">Back to ' + esc(longLabel(s)) + "</a></p>";
    var nav = pager(pagerLink("prev", sessionHref(s), label(s)), nextOf(s.n));
    if (!s.solutions) {
      ++seq;
      view.innerHTML = back + '<div class="notice"><p style="margin:0">The solutions to ' + esc(longLabel(s)) + " have not been written yet.</p></div>" + nav;
      window.scrollTo(0, 0);
      return;
    }
    fetchFile(s.solutions, "the solutions", function (text) {
      view.innerHTML = back + '<article class="prose">' + md(text) + "</article>" + nav;
      finish(s.solutions, -1); // here "Session N" for its own session links back to it
      window.scrollTo(0, 0);
    });
  }

  function sessionRow(s, withPart) {
    var meta = (withPart ? "Part " + s.part + " · " : "") + kindName(s.kind) + (s.gap ? " · labelled gap" : "") + (s.file ? "" : " · not yet written");
    var inner = '<span class="n">' + num(s) + '</span><div><b>' + esc(s.title) + '</b><span class="meta">' + esc(meta) + '</span><span class="text">' + esc(s.claim) + "</span></div>";
    return s.file ? '<li><a href="' + sessionHref(s) + '">' + inner + "</a></li>" : '<li><div class="row off">' + inner + "</div></li>";
  }

  function showPart(p) {
    ++seq;
    var pi = partIndex[p.id];
    markCurrent("part:" + p.id, p.id);
    setChrome("Part " + p.id, partLabel(p));
    var own = partSessions(p), cited = {};
    own.forEach(function (s) { s.uses.forEach(function (u) { var t = session(u); if (t && partIndex[t.part] < pi) cited[u] = t; }); });
    var tools = Object.keys(cited).map(Number).sort(function (a, b) { return a - b; }).map(function (n) { return cited[n]; });
    var k = writtenIn(p);
    var prevPart = pi > 0 ? pagerLink("prev", "#/part/" + book.parts[pi - 1].id, partLabel(book.parts[pi - 1])) : pagerLink("prev", "#/syllabus", "0. Syllabus");
    var nextPart = pi < book.parts.length - 1 ? pagerLink("next", "#/part/" + book.parts[pi + 1].id, partLabel(book.parts[pi + 1])) : "";
    view.innerHTML =
      '<section class="prose part"><h1>' + esc(partLabel(p)) + '</h1><p class="part-goal">' + esc(p.goal) + "</p>" +
      '<p class="part-meta">' + esc(range(p)) + " · " + k + " of " + own.length + " written</p>" +
      '<h2 class="section-h">Toolkit</h2>' +
      (tools.length ? '<p class="section-note">The results from earlier Parts that this Part\'s sessions cite.</p><ol class="contents sessions">' + tools.map(function (s) { return sessionRow(s, true); }).join("") + "</ol>"
                    : "<p>This Part uses nothing from earlier Parts.</p>") +
      '<h2 class="section-h">Sessions</h2><ol class="contents sessions">' + own.map(function (s) { return sessionRow(s, false); }).join("") + "</ol></section>" +
      pager(prevPart, nextPart);
    window.scrollTo(0, 0);
  }

  function showHome() {
    ++seq;
    markCurrent("", null);
    setChrome(book.title, "");
    var first = written[0], last = bySlug[load("last")];
    var start = first ? '<a class="start" href="' + sessionHref(first) + '">Start with Session ' + first.n + "</a>"
                      : '<a class="start" href="#/syllabus">Start with the syllabus</a>';
    var resume = last && last.file && last !== first ? '<a class="resume" href="' + sessionHref(last) + '">Continue with ' + esc(longLabel(last)) + "</a>" : "";
    view.innerHTML =
      '<section class="cover"><h1>' + esc(book.title) + '</h1><p class="sub">' + esc(book.subtitle) + "</p>" +
      '<p class="lead">' + esc(book.description) + "</p>" +
      "<p>It is aimed at three questions:</p>" +
      '<ol class="questions">' + book.questions.map(function (q, i) {
        return '<li><span class="q">Q' + (i + 1) + "</span><span>" + esc(q.charAt(0).toUpperCase() + q.slice(1)) + "</span></li>";
      }).join("") + "</ol>" +
      '<p class="actions">' + start + resume + '<a class="syl" href="#/syllabus">0. Syllabus</a></p>' +
      '<ol class="contents">' + book.parts.map(function (p) {
        var m = p.last - p.first + 1;
        return '<li><a href="#/part/' + esc(p.id) + '"><span class="n">' + esc(p.id) + "</span><div><b>" + esc(p.title) + '</b><span class="meta">' +
          esc(range(p)) + " · " + writtenIn(p) + " of " + m + ' written</span><span class="text">' + esc(p.goal) + "</span></div></a></li>";
      }).join("") + "</ol></section>";
    window.scrollTo(0, 0);
  }

  /* ---------- offline download ---------- */
  // One tap fetches every file the book needs; the service worker (sw.js)
  // stores each response as it passes through. Cache Storage itself is the
  // record of what is saved, so a cleared cache reads as unsaved next visit.
  // Each item is a file plus what it pulls in: a session brings its figures,
  // a stylesheet brings its fonts.
  var offline = document.getElementById("offline");
  var LIBS = [ // the same URLs as the <link> and <script> tags above
    "https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap",
    "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css",
    "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js",
    "https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
  ];
  var FIGURE = /!\[[^\]]*\]\(([^)\s]+)/g, WOFF2 = /url\(["']?([^)"']+\.woff2)["']?\)/g;
  var off = { status: "checking", have: 0, done: 0, failed: 0 };

  function offlineItems() {
    var items = ["./", "index.html", "book.json"].map(function (u) { return { url: u }; });
    items.push({ url: book.syllabus, page: true, deps: FIGURE });
    written.forEach(function (s) {
      items.push({ url: s.file, page: true, deps: FIGURE });
      if (s.solutions) items.push({ url: s.solutions, page: true, deps: FIGURE });
    });
    LIBS.forEach(function (u) { items.push({ url: u, deps: /\.css$|css2\?/.test(u) ? WOFF2 : null }); });
    return items;
  }
  function pageCount() { return offlineItems().filter(function (it) { return it.page; }).length; }
  async function isSaved(url) { try { return !!(await caches.match(url)); } catch (e) { return false; } }

  // Fetches go through the service worker only once it controls the page,
  // which on a first visit happens a moment after it installs.
  function controlled() {
    if (navigator.serviceWorker.controller) return Promise.resolve();
    return new Promise(function (resolve) {
      navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true });
      setTimeout(resolve, 8000);
    });
  }
  async function saveFile(url) {
    var r = await fetch(url);
    if (!r.ok) throw new Error(url + ": " + r.status);
    var body = await r.text();
    if (!(await isSaved(url))) throw new Error(url + ": not cached");
    return body;
  }
  async function saveItem(it) {
    var body = await saveFile(it.url);
    if (it.page) cache[it.url] = body;
    if (!it.deps) return;
    var base = new URL(it.url, location.href), urls = [], m;
    it.deps.lastIndex = 0;
    while ((m = it.deps.exec(body))) urls.push(new URL(m[1], base).href);
    await Promise.all(urls.map(saveFile));
  }

  // The service worker saves the page and libraries on its own at first
  // visit, so "partially saved" is judged by the syllabus, sessions and
  // solutions alone.
  async function checkOffline() {
    var items = offlineItems(), all = true, have = 0;
    for (var i = 0; i < items.length; i++) {
      var ok = await isSaved(items[i].url);
      all = all && ok;
      if (ok && items[i].page) have++;
    }
    off.have = have;
    off.status = all && !off.failed ? "done" : have ? "partial" : "idle";
    drawOffline();
  }
  async function saveOffline() {
    var queue = offlineItems();
    off.status = "saving"; off.done = 0; off.failed = 0; drawOffline();
    await controlled();
    async function worker() {
      while (queue.length) {
        var it = queue.shift();
        try { await saveItem(it); } catch (e) { off.failed++; }
        off.done++; drawOffline();
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    await checkOffline();
  }

  function drawOffline() {
    var total = offlineItems().length, pages = pageCount(), n = written.length, html;
    var what = n ? "The syllabus, the " + (n === 1 ? "written session" : n + " written sessions") + ", their solutions and the fonts" : "The syllabus and the fonts";
    if (off.status === "checking") html = '<p class="hint">Checking what is saved…</p>';
    else if (off.status === "saving") html = "<p>Saving… " + off.done + "/" + total + '</p><div class="meter"><div style="width:' + Math.round(100 * off.done / total) + '%"></div></div>';
    else if (off.status === "done") html = "<p>Saved. " + what + " work without a connection.</p>" + '<button class="again" data-act="save">Download again</button>';
    else if (off.status === "partial") html = "<p>" + off.have + " of " + pages + " pages saved." + (off.failed ? " Some files did not download; check the connection." : "") + "</p>" + '<button class="save" data-act="save">' + (off.failed ? "Try again" : "Save the rest") + "</button>";
    else html = '<p class="hint">Save the syllabus and every written session, with its solutions, to read without a connection.</p><button class="save" data-act="save">Save for offline</button>';
    offline.innerHTML = "<h2>Offline</h2>" + html;
  }
  offline.addEventListener("click", function (e) {
    if (e.target.closest("[data-act=save]") && off.status !== "saving") saveOffline();
  });
  function initOffline() {
    if (!("serviceWorker" in navigator) || typeof caches === "undefined") return;
    navigator.serviceWorker.register("sw.js").catch(function () {});
    offline.hidden = false;
    drawOffline();
    checkOffline();
  }

  /* ---------- routing ---------- */
  function route() {
    var parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
    var s = parts[1] ? bySlug[parts[1]] : null;
    if (parts[0] === "syllabus") showSyllabus();
    else if (parts[0] === "part" && parts[1] in partIndex) showPart(partOf(parts[1]));
    else if (parts[0] === "s" && s) showSession(s);
    else if (parts[0] === "sol" && s) showSolutions(s);
    else showHome();
  }
  fetch("book.json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (b) {
      book = b;
      book.sessions.forEach(function (s) { bySlug[s.slug] = s; if (s.file) written.push(s); });
      book.parts.forEach(function (p, i) { partIndex[p.id] = i; });
      buildToc(); initOffline(); route(); window.addEventListener("hashchange", route);
    })
    .catch(function () {
      view.innerHTML = '<div class="notice"><p><strong>The book could not be loaded.</strong></p><p>The file <code>book.json</code> was not found or could not be read. If you opened <code>index.html</code> directly from disk, serve the folder instead: run <code>python -m http.server</code> in it and open <code>http://localhost:8000</code>.</p></div>';
    });
})();
</script>
</body>
</html>
