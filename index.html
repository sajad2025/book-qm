  .prose p.caption em { font-style: normal; }
  .math-block { overflow-x: auto; overflow-y: hidden; margin: 1.15em 0; padding: .15em 0; position: relative; }

  .crumb { margin: 0 0 .9rem; font-size: .88rem; color: var(--muted); }

      (tools.length ? '<p class="section-note">' + T.toolkitNote + '</p><ol class="contents sessions">' + tools.map(function (s) { return sessionRow(s, true); }).join("") + "</ol>"
                    : "<p>" + T.toolkitNone + "</p>") +
      '<h2 class="section-h">' + T.sessionsHead + '</h2><ol class="contents sessions">' + own.map(function (s) { return sessionRow(s, false); }).join("") + "</ol></section>" +
      pager(prevPart, nextPart);
    window.scrollTo(0, 0);
  }

  function showHome() {
    ++seq;
    markCurrent("", null);
    setChrome(book.title, "");
    var first = written[0], last = bySlug[load("last")];
    var start = first ? '<a class="start" href="' + sessionHref(first) + '">' + fmt(T.startWith, { n: dig(first.n) }) + "</a>"
                      : '<a class="start" href="#/syllabus">' + T.startSyllabus + "</a>";
    var resume = last && last.file && last !== first ? '<a class="resume" href="' + sessionHref(last) + '">' + esc(fmt(T.continueWith, { s: longLabel(last) })) + "</a>" : "";
    var other = LANG === "fa" ? "en" : "fa";
    view.innerHTML =
      '<section class="cover"><p class="switch"><button type="button" data-lang="' + other + '" lang="' + other + '" dir="' + (other === "fa" ? "rtl" : "ltr") + '">' + T.switchCover + "</button></p>" +
      "<h1>" + esc(book.title) + '</h1><p class="sub">' + esc(book.subtitle) + "</p>" +
      '<p class="lead">' + esc(book.description) + "</p>" +
      "<p>" + T.aimed + "</p>" +
      '<ol class="questions">' + book.questions.map(function (q, i) {
        return '<li><span class="q">Q' + (i + 1) + "</span><span>" + esc(LANG === "fa" ? q : q.charAt(0).toUpperCase() + q.slice(1)) + "</span></li>";
      }).join("") + "</ol>" +
      '<p class="actions">' + start + resume + '<a class="syl" href="#/syllabus">' + SYL + "</a></p>" +
      '<ol class="contents">' + book.parts.map(function (p) {
        var m = p.last - p.first + 1;
        return '<li><a href="#/part/' + esc(p.id) + '"><span class="n">' + dig(p.id) + "</span><div><b>" + esc(p.title) + '</b><span class="meta">' +
          esc(range(p)) + " · " + dig(writtenIn(p)) + " " + T.of + " " + dig(m) + " " + T.written + '</span><span class="text">' + esc(p.goal) + "</span></div></a></li>";
      }).join("") + "</ol></section>";
    view.querySelector(".switch button").onclick = function () { setLang(this.dataset.lang); };
    window.scrollTo(0, 0);
  }

  /* ---------- offline download ---------- */
  // One tap fetches every file the book needs; the service worker (sw.js)
  // stores each response as it passes through. Cache Storage itself is the
  // record of what is saved, so a cleared cache reads as unsaved next visit.
  // Each item is a file plus what it pulls in: a session brings its figures,
  // a stylesheet brings its fonts.
  var offline = document.getElementById("offline");
  var LIBS = [ // the same URLs as the <link> and <script> tags above
    "https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700&display=swap",
    "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css",
    "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js",
    "https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
  ];
  var FIGURE = /!\[[^\]]*\]\(([^)\s]+)/g, WOFF2 = /url\(["']?([^)"']+\.woff2)["']?\)/g;
  var off = { status: "checking", have: 0, done: 0, failed: 0 };

  function offlineItems() {
    var items = ["./", "index.html", "book.json"].map(function (u) { return { url: u }; });
    items.push({ url: book.syllabus, page: true, deps: FIGURE });
    written.forEach(function (s) {
      items.push({ url: s.file, page: true, deps: FIGURE });
      if (s.solutions) items.push({ url: s.solutions, page: true, deps: FIGURE });
    });
    LIBS.forEach(function (u) { items.push({ url: u, deps: /\.css$|css2\?/.test(u) ? WOFF2 : null }); });
    return items;
  }
  function pageCount() { return offlineItems().filter(function (it) { return it.page; }).length; }
  async function isSaved(url) { try { return !!(await caches.match(url)); } catch (e) { return false; } }

  // Fetches go through the service worker only once it controls the page,
  // which on a first visit happens a moment after it installs.
  function controlled() {
    if (navigator.serviceWorker.controller) return Promise.resolve();
    return new Promise(function (resolve) {
      navigator.serviceWorker.addEventListener("controllerchange", resolve, { once: true });
      setTimeout(resolve, 8000);
    });
  }
  async function saveFile(url) {
    var r = await fetch(url);
    if (!r.ok) throw new Error(url + ": " + r.status);
    var body = await r.text();
    if (!(await isSaved(url))) throw new Error(url + ": not cached");
    return body;
  }
  async function saveItem(it) {
    var body = await saveFile(it.url);
    if (it.page) cache[it.url] = body;
    if (!it.deps) return;
    var base = new URL(it.url, location.href), urls = [], m;
    it.deps.lastIndex = 0;
    while ((m = it.deps.exec(body))) urls.push(new URL(m[1], base).href);
    await Promise.all(urls.map(saveFile));
  }

  // The service worker saves the page and libraries on its own at first
  // visit, so "partially saved" is judged by the syllabus, sessions and
  // solutions alone.
  async function checkOffline() {
    var items = offlineItems(), all = true, have = 0;
    for (var i = 0; i < items.length; i++) {
      var ok = await isSaved(items[i].url);
      all = all && ok;
      if (ok && items[i].page) have++;
    }
    off.have = have;
    off.status = all && !off.failed ? "done" : have ? "partial" : "idle";
    drawOffline();
  }
  async function saveOffline() {
    var queue = offlineItems();
    off.status = "saving"; off.done = 0; off.failed = 0; drawOffline();
    await controlled();
    async function worker() {
      while (queue.length) {
        var it = queue.shift();
        try { await saveItem(it); } catch (e) { off.failed++; }
        off.done++; drawOffline();
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    await checkOffline();
  }

  function drawOffline() {
    var total = offlineItems().length, pages = pageCount(), n = written.length, html;
    var what = fmt(T.savedWhat, { n: dig(n) });
    if (off.status === "checking") html = '<p class="hint">' + T.checking + "</p>";
    else if (off.status === "saving") html = "<p>" + T.saving + " " + dig(off.done) + "/" + dig(total) + '</p><div class="meter"><div style="width:' + Math.round(100 * off.done / total) + '%"></div></div>';
    else if (off.status === "done") html = "<p>" + fmt(T.saved, { w: what }) + "</p>" + '<button class="again" data-act="save">' + T.again + "</button>";
    else if (off.status === "partial") html = "<p>" + fmt(T.partial, { h: dig(off.have), p: dig(pages) }) + (off.failed ? T.failed : "") + "</p>" + '<button class="save" data-act="save">' + (off.failed ? T.tryAgain : T.saveRest) + "</button>";
    else html = '<p class="hint">' + T.saveHint + '</p><button class="save" data-act="save">' + T.saveBtn + "</button>";
    offline.innerHTML = "<h2>" + T.offline + "</h2>" + html;
  }
  offline.addEventListener("click", function (e) {
    if (e.target.closest("[data-act=save]") && off.status !== "saving") saveOffline();
  });
  function initOffline() {
    if (!("serviceWorker" in navigator) || typeof caches === "undefined") return;
    navigator.serviceWorker.register("sw.js").catch(function () {});
    offline.hidden = false;
    drawOffline();
    checkOffline();
  }

  // In Farsi, each title, claim, goal and file is replaced by its Farsi
  // version where one exists; an untranslated file is shown in English with
  // a note (fallbackNote).
  var english = {};
  function localise(b) {
    ["title", "subtitle", "description", "questions"].forEach(function (k) { if (b[k + "_fa"]) b[k] = b[k + "_fa"]; });
    if (b.syllabus_fa) b.syllabus = b.syllabus_fa; else english[b.syllabus] = true;
    b.parts.forEach(function (p) { if (p.title_fa) p.title = p.title_fa; if (p.goal_fa) p.goal = p.goal_fa; });
    b.sessions.forEach(function (s) {
      if (s.title_fa) s.title = s.title_fa;
      if (s.claim_fa) s.claim = s.claim_fa;
      if (s.file && s.file_fa) s.file = s.file_fa; else if (s.file) english[s.file] = true;
      if (s.solutions && s.solutions_fa) s.solutions = s.solutions_fa; else if (s.solutions) english[s.solutions] = true;
    });
  }
  function fallbackNote(file) {
    return english[file] ? '<div class="notice fallback"><p style="margin:0">' + T.fallback + "</p></div>" : "";
  }

  /* ---------- routing ---------- */
  function route() {
    var parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
    var s = parts[1] ? bySlug[parts[1]] : null;
    if (parts[0] === "syllabus") showSyllabus();
    else if (parts[0] === "part" && parts[1] in partIndex) showPart(partOf(parts[1]));
    else if (parts[0] === "s" && s) showSession(s);
    else if (parts[0] === "sol" && s) showSolutions(s);
    else showHome();
  }
  fetch("book.json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (b) {
      book = b;
      if (LANG === "fa") localise(book);
      book.sessions.forEach(function (s) { bySlug[s.slug] = s; if (s.file) written.push(s); });
      book.parts.forEach(function (p, i) { partIndex[p.id] = i; });
      buildToc(); initOffline(); route(); window.addEventListener("hashchange", route);
    })
    .catch(function () {
      view.innerHTML = '<div class="notice">' + T.bookMissing + "</div>";
    });
})();
</script>
</body>
</html>
